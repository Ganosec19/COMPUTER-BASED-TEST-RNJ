async function admin(){if(!USEFB)return adminLokal();try{const f=await fx();await f.u.signInWithEmailAndPassword(f.au,$('au').value.trim(),$('pin').value);adm()}catch(e){alert('Login admin gagal: '+(e.code||e.message))}}
function pushSesi(s){if(USEFB)fset('sesi',sid(s.id),{buka:!!s.buka,mulai:s.mulai,token:s.token||'',izin:s.izin||[]},true).catch(e=>alert('Gagal menyimpan ke Firebase: '+(e.code||e.message)))}
function bulk(a){const X=SES(),V=X.filter(s=>s.pk==FP&&(FK=='Semua'||s.kl==FK)),t=tok();V.forEach(s=>{if(a=='buka')s.buka=true;else s.token=t});S('sesi',X);V.forEach(pushSesi);adm()}
async function pushPes(P){if(!USEFB)return;try{const r=[];for(const p of P)r.push([p.ni,{nm:p.nm,pk:p.pk,kl:p.kl||'',rg:p.rg||'',ph:p.pw?await sha(p.ni+':'+p.pw):''}]);await fbatch('peserta',r);alert(P.length+' peserta tersimpan di Firebase.')}catch(e){alert('Gagal menyimpan peserta ke Firebase: '+(e.code||e.message))}}
async function tarik(){try{const w=[['pk','==',FP]];if(FK!='Semua')w.push(['kl','==',FK]);const R=await flist('hasil',w),H=L('hasil',[]).filter(h=>!(h.id&&R.some(r=>r.id==h.id)));R.forEach(r=>{const q=(BANK[r.mp]||{q:[]}).q;let b=0,n=0;q.forEach((x,i)=>{if(x.t=='pg'){n++;if(r.a[i]===x.k)b++}});H.push({id:r.id,nm:r.nm,ni:r.ni,pk:r.pk,kl:r.kl,mp:r.mp,a:r.a,es:r.es||{},b,n,skor:n?Math.round(b/n*100):0,waktu:r.ts?new Date(r.ts).toLocaleString('id-ID'):''})});S('hasil',H);alert(R.length+' hasil ditarik (sebanyak itu pembacaan Firestore).');adm()}catch(e){alert('Gagal menarik hasil: '+(e.code||e.message))}}
async function muatSesi(){try{const J=await flist('jadwal',[]),T=await flist('sesi',[]),m={},X=[];T.forEach(s=>m[s.id]=s);J.forEach(g=>g.items.forEach(i=>{const d=m[i.id]||{};X.push({...i,pk:g.pk,kl:g.kl,nama:i.hari+', '+i.jam+' WIB',token:d.token||tok(),buka:!!d.buka,mulai:d.mulai??i.mulai,izin:d.izin||[]})}));S('sesi',X);alert(X.length+' sesi dimuat.');adm()}catch(e){alert('Gagal memuat sesi: '+(e.code||e.message))}}
function xrows(el,cb){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const w=XLSX.read(e.target.result,{type:'array'});cb(XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,raw:false,defval:''}).slice(1).map(x=>x.map(c=>String(c).trim())).filter(x=>x.some(Boolean)))}catch(err){alert('File tidak dapat dibaca: '+err.message)}};r.readAsArrayBuffer(f)}
function tgl(s){let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):null}
function jam(s){const m=s.match(/^(\d{1,2})[:.](\d{2})/);return m?m[1].padStart(2,'0')+':'+m[2]:null}
function jdwHTML(){return`<div class="c"><h2>Jadwal Ujian (Excel)</h2><small>Kolom: Paket, Kelas, Tanggal (YYYY-MM-DD), Jam Mulai, Jam Selesai, Mapel, Pengawas, Ruang. Format kolom Tanggal dan Jam sebagai Teks. Unggah ulang untuk mengganti jadwal (token sesi dibuat ulang).</small><div class="row"><button class="g" onclick="tplJ()">⬇ Template jadwal</button>${USEFB?'<button class="g" onclick="muatSesi()">Muat sesi dari server</button>':''}</div><input type="file" accept=".xlsx,.xls,.csv" onchange="impJ(this)"></div>`}
function tplJ(){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Paket','Kelas','Tanggal','Jam Mulai','Jam Selesai','Mapel','Pengawas','Ruang'],['Paket A','4','2026-12-01','09:00','10:00','Bahasa Indonesia','Nama Pengawas','Lt.2 R.Kelas']]),'Jadwal');simpan('template-jadwal-ujian.xlsx',XLSX.write(w,{bookType:'xlsx',type:'array'}))}
function impJ(el){xrows(el,async R=>{const ok=['Paket A','Paket B','Paket C IPA','Paket C IPS'],G={},bad=[];
R.forEach((x,i)=>{const[pk,kl,t,a,b,mp,pg,rg]=x,T=tgl(t||''),A=jam(a||''),B=jam(b||'');if(!ok.includes(pk)||!kl||!T||!A||!B||!mp){bad.push(i+2);return}const ms=Date.parse(T+'T'+A+':00+07:00'),me=Date.parse(T+'T'+B+':00+07:00'),k=sid(pk+'_'+kl);(G[k]=G[k]||{pk,kl,items:[]}).items.push({id:sid(pk+'_'+kl+'_'+T+'_'+A+'_'+mp),hari:T,jam:A+'-'+B,mp:mp+' · Kelas '+kl,menit:Math.round((me-ms)/60000),mulai:ms,pg:pg||'',rg:rg||''})});
if(!Object.keys(G).length)return alert('Tidak ada baris valid. Periksa format template.');
const X=[];Object.values(G).forEach(g=>{g.items.sort((a,b)=>a.mulai-b.mulai);g.items.forEach(i=>X.push({...i,pk:g.pk,kl:g.kl,nama:i.hari+', '+i.jam+' WIB',token:tok(),buka:false,izin:[]}))});S('sesi',X);
if(USEFB){try{await fbatch('jadwal',Object.entries(G).map(([k,g])=>[k,{pk:g.pk,kl:g.kl,items:g.items}]));await fbatch('sesi',X.map(s=>[sid(s.id),{buka:false,mulai:s.mulai,token:s.token,izin:[]}]))}catch(e){return alert('Gagal menyimpan jadwal ke Firebase: '+(e.code||e.message))}}
alert(X.length+' sesi dibuat'+(bad.length?'. Baris bermasalah: '+bad.slice(0,15).join(', '):'')+'.');adm()})}
function bankHTML(){const B=L('bank',{}),ks=Object.keys(B);return`<div class="c"><h2>Bank Soal (Excel)</h2><small>Kolom: Kelas, Mapel, Jenis (PG/ESAI), Soal, A, B, C, D, E, Kunci (A-E), Gambar (alamat URL, boleh kosong). Satu file boleh berisi banyak kelas dan mapel. Nama Mapel dan Kelas harus sama dengan di jadwal.</small><div class="row"><button class="g" onclick="tplB()">⬇ Template bank soal</button></div><input type="file" accept=".xlsx,.xls,.csv" onchange="impB(this)"><div class="wrap"><table><tr><th>Mapel / Kelas</th><th>PG</th><th>Esai</th><th>PG tanpa kunci</th></tr>${ks.map(k=>{const q=B[k].q,nk=q.filter(x=>x.t=='pg'&&x.k==null).length;return`<tr><td>${esc(k)}</td><td>${q.filter(x=>x.t=='pg').length}</td><td>${q.filter(x=>x.t=='es').length}</td><td class="${nk?'no':''}">${nk}</td></tr>`}).join('')||'<tr><td colspan="4">Belum ada bank soal</td></tr>'}</table></div></div>`}
function tplB(){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Kelas','Mapel','Jenis','Soal','A','B','C','D','E','Kunci','Gambar'],['4','Matematika','PG','12 + 8 = ...','18','20','22','24','','B',''],['4','Matematika','ESAI','Jelaskan cara menjumlahkan bilangan puluhan.','','','','','','','']]),'Bank Soal');simpan('template-bank-soal.xlsx',XLSX.write(w,{bookType:'xlsx',type:'array'}))}
function impB(el){xrows(el,async R=>{const B={},bad=[];R.forEach((x,i)=>{const[kl,mp,j,s,a,b,c,d,e,kn,img]=x;if(!kl||!mp||!s){bad.push(i+2);return}const k=mp+' · Kelas '+kl,q={t:/^es/i.test(j||'')?'es':'pg',s};if(q.t=='pg'){const o=[a,b,c,d,e].filter(Boolean);if(o.length<2){bad.push(i+2);return}q.o=o;const ki='ABCDE'.indexOf((kn||'').toUpperCase().slice(0,1));q.k=ki>=0&&ki<o.length?ki:null}if(img)q.img=img;(B[k]=B[k]||{q:[]}).q.push(q)});
if(!Object.keys(B).length)return alert('Tidak ada soal valid. Periksa format template.');const all=Object.assign(L('bank',{}),B);S('bank',all);Object.assign(BANK,all);
if(USEFB){try{await fbatch('bank',Object.entries(B).map(([k,v])=>[sid(k),{q:v.q}]))}catch(e){return alert('Gagal menyimpan soal ke Firebase: '+(e.code||e.message))}}
alert(Object.keys(B).length+' bank soal dimuat'+(bad.length?'. Baris bermasalah: '+bad.slice(0,15).join(', '):'')+'.');adm()})}
function csvOld(){const H=L('hasil',[]);const r=[['Nama','NIS','Paket','Mapel','Benar','Total PG','Skor PG','Nilai Esai']].concat(H.map(h=>[h.nm,h.ni,h.pk,h.mp,h.b,h.n,h.skor,Object.values(h.es).join('|')]));
const u=URL.createObjectURL(new Blob([r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='hasil-cbt.csv';a.click()}
Object.assign(BANK,L('bank',{}));if(USEFB){fetch(location.href,{method:'HEAD',cache:'no-store'}).then(r=>{const d=r.headers.get('Date');if(d)OFF=Date.parse(d)-Date.now()}).catch(()=>{});flush()}
home();
</script></body></html>
