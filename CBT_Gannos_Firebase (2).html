async function kirim(auto){if(!auto){const k=Q.q.filter((_,i)=>st.a[i]===undefined||String(st.a[i]).trim()==='').length;if(k&&!confirm('Masih ada '+k+' soal belum dijawab. Tetap kirim?'))return;if(!confirm('Kirim jawaban sekarang? Tidak dapat diubah setelah dikirim.'))return}

catch(e){if(e.code=='permission-denied'){A.innerHTML='<div class="c no">Jawaban ditolak server (mungkin sudah pernah terkirim). Hubungi proktor.</div>';return}A.innerHTML=`<div class="c"><h2>Koneksi bermasalah</h2>Mencoba lagi (${n+1}/8)... jawaban aman di perangkat.</div>`;await sleep(2000*(n+1))}}
A.innerHTML='<div class="c"><h2>Belum terkirim</h2>Jawaban aman di perangkat. Periksa sinyal lalu tekan tombol di bawah.</div><button onclick="kirim(true)">Kirim ulang</button>'}

async function adm(){try{const ss=(await db.collection('sesi').orderBy('c','desc').get()).docs.map(d=>({id:d.id,...d.data()}));
A.innerHTML=`<h1>Panel Admin / Guru</h1><small>${esc(auth.currentUser.email)}</small>
<div class="c"><h2>1. Data Peserta</h2><small>Unduh template Excel, isi, lalu unggah. Kolom PIN boleh dikosongkan: PIN 5 angka dibuat otomatis.</small><button class="g" onclick="tplPes()">Unduh template Excel peserta</button><input type="file" id="fp" accept=".csv,.xlsx,.xls" onchange="impPes(this)"><button onclick="kartu('')">Cetak / Unduh Kartu Peserta</button></div>

${ss.map(s=>`<div class="c"><b>${esc(s.mp)}</b> · ${s.menit} mnt · Token <b>${s.id}</b> <span class="tag">${s.dl?'Sudah diunduh':'Belum diunduh'}</span><div class="row"><button onclick="unduh('${s.id}')">Unduh CSV jawaban</button><button class="g" ${s.dl?'':'disabled'} onclick="hapus('${s.id}')">Hapus jawaban di server</button></div></div>`).join('')}

function simpanX(n,d){const u=URL.createObjectURL(new Blob([d],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function tplPes(){const H=['Nomor Peserta','Nama Lengkap','Paket','PIN'];
if(typeof XLSX==='undefined')return simpan('template-peserta.csv',toCsv([H]));
const w=XLSX.utils.book_new(),a=XLSX.utils.aoa_to_sheet([H]);a['!cols']=[{wch:20},{wch:38},{wch:18},{wch:12}];XLSX.utils.book_append_sheet(w,a,'Peserta');
const p=XLSX.utils.aoa_to_sheet([['PETUNJUK - Gannos Digital Indonesia'],['Isi data mulai baris 2 pada sheet Peserta. Jangan mengubah judul kolom.'],['A: Nomor Peserta (unik, huruf/angka tanpa spasi). B: Nama Lengkap. C: Paket (contoh: Paket A / Paket B / Paket C IPA).'],['D: PIN siswa (huruf/angka tanpa spasi). Boleh dikosongkan: sistem membuat PIN 5 angka otomatis.'],['Setelah diisi, simpan lalu unggah di Panel Admin > Data Peserta. Kartu peserta dicetak dari menu yang sama.'],[],['Contoh (jangan ditulis di sheet Peserta):'],H,['2026001','Budi Santoso','Paket A','48213']]);p['!cols']=[{wch:110}];XLSX.utils.book_append_sheet(w,p,'Petunjuk');

async function impPes(el){const f=el.files[0];if(!f)return;const seen={},r=[];(await baca(f)).slice(1).forEach(x=>{const ni=cl(x[0]),nm=String(x[1]).trim();if(!ni||!nm||seen[ni])return;seen[ni]=1;r.push({ni,nm,pk:String(x[2]).trim()||'-',pin:cl(x[3])||String(Math.floor(10000+Math.random()*90000))})});
if(!r.length)return alert('Tidak ada data valid. Pastikan memakai template (kolom A-D, data mulai baris 2).');if(!confirm(r.length+' peserta akan disimpan. Lanjut?'))return;
try{for(let i=0;i<r.length;i+=400){const b=db.batch();r.slice(i,i+400).forEach(x=>b.set(db.doc('peserta/'+x.ni+'_'+x.pin),{ni:x.ni,nm:x.nm,pk:x.pk}));await b.commit()}}catch(e){return alert('Gagal menyimpan: '+(e.code||e.message))}

let KD=[];

const PK=[...new Set(d.map(x=>x.pk))],f=pk?d.filter(x=>x.pk==pk):d,url=location.origin+location.pathname;KD=f;

<div class="kg">${f.map(x=>`<div class="kt"><h3>KARTU PESERTA CBT · Gannos Digital Indonesia</h3><table><tr><td>Nama</td><td><b>${esc(x.nm)}</b></td></tr><tr><td>Nomor Peserta</td><td><b>${esc(x.ni)}</b></td></tr><tr><td>Paket</td><td>${esc(x.pk)}</td></tr><tr><td>PIN</td><td class="pin">${esc(x.pin)}</td></tr></table><small>Alamat ujian: ${esc(url)}</small><small>Rahasiakan PIN Anda. Jangan diberikan kepada siapa pun.</small></div>`).join('')}</div>`}catch(e){alert('Gagal memuat peserta: '+(e.code||e.message))}}
async function terbit(){const f=$('fs').files[0],mp=$('mp').value.trim(),mn=Number($('mn').value);if(!f||!mp||!mn)return alert('Isi mapel, durasi, dan pilih file soal');
const q=[],k={};(await baca(f)).slice(1).forEach(x=>{if(!String(x[1]).trim())return;if(/^e/i.test(x[0]))q.push({t:'es',s:String(x[1])});else{const j='ABCD'.indexOf(String(x[6]).trim().toUpperCase());if(j<0)return;k[q.length]=j;q.push({t:'pg',s:String(x[1]),o:[x[2],x[3],x[4],x[5]].map(String)})}});
if(!q.length)return alert('Soal tidak terbaca');const tk=tok(),b=db.batch();b.set(db.doc('soal/'+tk),{mp,menit:mn,q});b.set(db.doc('kunci/'+tk),{k});b.set(db.doc('sesi/'+tk),{mp,menit:mn,c:Date.now(),dl:false});await b.commit();alert('Sesi dibuat. Token: '+tk);adm()}
async function unduh(tk){const d=(await db.collection('jawaban').where('tk','==',tk).get()).docs.map(x=>x.data());if(!d.length)return alert('Belum ada jawaban masuk.');

async function hapus(tk){if(prompt('Pastikan CSV tersimpan aman. Ketik HAPUS untuk menghapus semua jawaban sesi ini dari server:')!=='HAPUS')return;

async function impKor(el){const K=L('kor',{}),SQ=L('sq',{});let n=0;try{for(const f of el.files){const R=(await baca(f)).slice(1);for(const x of R){const[tk,mp,ni,nm,pk,w,a]=x;if(!tk||!ni)continue;
if(!SQ[tk]){const[s,k]=await Promise.all([db.doc('soal/'+tk).get(),db.doc('kunci/'+tk).get()]);if(!s.exists||!k.exists)continue;SQ[tk]={q:s.data().q,k:k.data().k}}
const id=ni+'|'+tk;K[id]=K[id]||{es:{}};Object.assign(K[id],{ni,nm,pk,mp,tk,a:JSON.parse(a||'{}')});n++}}}catch(e){alert('Gagal: '+(e.code||e.message))}
S('kor',K);S('sq',SQ);alert(n+' jawaban siswa diimpor.');korView()}
let OPEN=-1;function hit(e,SQ){const{q,k}=SQ[e.tk],pg=q.map((x,i)=>x.t=='pg'?i:-1).filter(i=>i>=0),es=q.map((x,i)=>x.t=='es'?i:-1).filter(i=>i>=0),bw=L('bw',70);
const b=pg.filter(i=>e.a[i]===k[i]).length,skor=pg.length?Math.round(b/pg.length*100):0,done=es.length&&es.every(i=>e.es[i]!==undefined&&e.es[i]!==''),ev=done?Math.round(es.reduce((s,i)=>s+Number(e.es[i]),0)/es.length):null;
return{b,n:pg.length,skor,es:es.length?ev:'',fin:!es.length?skor:done?Math.round(skor*bw/100+ev*(100-bw)/100):''}}
function korView(){const K=L('kor',{}),SQ=L('sq',{}),ks=Object.keys(K),bw=L('bw',70);if(!$('kor'))return;
$('kor').innerHTML=!ks.length?'':`<div class="c"><h2>Hasil Koreksi (${ks.length})</h2><div class="row"><div><small>Bobot PG (%)</small><input type="number" value="${bw}" onchange="S('bw',Math.min(100,Math.max(0,Number(this.value))));korView()"></div><button onclick="expK()">Unduh hasil koreksi (CSV)</button></div><button class="g" onclick="if(confirm('Hapus hasil koreksi di browser ini?')){S('kor',{});korView()}">Kosongkan</button></div>`+
ks.map((id,i)=>{const e=K[id],h=hit(e,SQ),q=SQ[e.tk].q,k=SQ[e.tk].k;return`<details ${OPEN===i?'open':''}><summary><b>${esc(e.nm)}</b> · ${esc(e.mp)} · PG ${h.b}/${h.n} (${h.skor}) · Akhir: <b>${h.fin===''?'esai belum dinilai':h.fin}</b></summary>
${q.map((x,n)=>{if(x.t=='es')return`<div class="c"><small>No ${n+1} · Esai</small><p>${esc(x.s)}</p><div style="white-space:pre-wrap">${esc(e.a[n]||'(kosong)')}</div><input type="number" min="0" max="100" placeholder="Nilai 0-100" value="${e.es[n]??''}" onchange="nes(${i},${n},this.value)"></div>`;
const ok=e.a[n]===k[n];return`<div class="opt ${ok?'ok':'no'}"><b>${n+1}.</b> ${ok?'✔ Benar':'✘ Salah'} · jawaban: ${'ABCD'[e.a[n]]||'-'} · kunci: ${'ABCD'[k[n]]}</div>`}).join('')}</details>`}).join('')}
function nes(i,n,v){const K=L('kor',{}),id=Object.keys(K)[i];K[id].es[n]=v===''?'':Math.min(100,Math.max(0,Number(v)));S('kor',K);OPEN=i;korView()}
function expK(){const K=L('kor',{}),SQ=L('sq',{});simpan('hasil-koreksi.csv',toCsv([['NIS','Nama','Paket','Mapel','Benar','Total PG','Skor PG','Nilai Esai','Nilai Akhir']].concat(Object.values(K).map(e=>{const h=hit(e,SQ);return[e.ni,e.nm,e.pk,e.mp,h.b,h.n,h.skor,h.es,h.fin]}))))}
home();
</script></body></html>
